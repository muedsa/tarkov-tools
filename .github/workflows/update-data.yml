name: Update Data from tarkov.dev

on:
  schedule:
    - cron: "47 0,6,12,18 * * *"
  workflow_dispatch: {}

jobs:
  run-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies (prefer ci)
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Update data from tarkov.dev
        run: |
          npm run script:fetchDataPve && npm run script:foundInRaidPve && npm run script:imageDownloaderPve
          npm run script:fetchDataPvp && npm run script:foundInRaidPvp && npm run script:imageDownloaderPvp

      - name: Commit and push changes in public/
        env:
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add public || true
          if git diff --staged --quiet; then
            echo "No changes in public/ to commit"
          else
            # 使用东八区时间并以 ISO 8601 格式添加到提交信息中（例如 2025-12-03T10:25:00+08:00）
            timestamp=$(TZ='Asia/Shanghai' date '+%Y-%m-%dT%H:%M:%S%:z')
            git commit -m "chore: update public by scheduled scripts - $timestamp"
            git push
          fi
